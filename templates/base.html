<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Expense Tracker{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
        <nav class="navbar navbar-expand-lg navbar-dark app-navbar">
            <div class = "container">
                <a class="navbar-brand brand-mark" href="{{ url_for('home') }}">
                   <span class="brand-dot"></span> Dashboard
                </a> 
                <div class="d-flex flex-wrap align-items-center gap-2">
                    <a class="nav-link" href="{{ url_for('view_categories') }}">Categories</a>
                    <a class="nav-link" href="{{ url_for('view_expenses') }}">Expenses</a>
                    <a class="nav-link" href="{{ url_for('help_iterable') }}">Help</a>
                    <a class="btn btn-light btn-sm nav-action" href="{{ url_for('login') }}">Login</a>
                </div>
            </div>
        </nav>
        <main class="container page-shell">
            {% for message in get_flashed_messages() %}
                <div class="alert alert-warning alert-dismissible fade show mt-3" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endfor %}
            {%block content%}{%endblock%}
        </main>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
